name: Meeting Auto-Dispatch & Sync Cron

on:
  schedule:
    # Runs every 5 minutes (free on GitHub Actions) to check for meetings starting within 5 minutes
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  auto-dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Meeting Auto-Dispatch
        run: |
          PROD_URL="https://3-z-isims-git-master-adams-projects-8dbb1d02.vercel.app"
          echo "Triggering auto-dispatch at $PROD_URL/api/cron/meetings/auto-dispatch..."
          curl -s -X POST "$PROD_URL/api/cron/meetings/auto-dispatch" \
            -H "Content-Type: application/json" \
            || echo "Auto-dispatch trigger completed."
